appId: com.ygo.collectionmanager
productName: YGO Collection Manager
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/*.map'
  - '!**/{README,CHANGELOG,HISTORY}.md'
  # Only the int-quantized LSTM English model is used.
  - '!node_modules/@tesseract.js-data/eng/4.0.0/**'
  # better-sqlite3 ships prebuilt binaries; its C sources aren't needed.
  - '!node_modules/better-sqlite3/{deps,src}/**'
  - '!node_modules/better-sqlite3/binding.gyp'
  - '!node_modules/node-addon-api/**'
# better-sqlite3 ships Node-API prebuilds (ABI-stable across Node/Electron),
# so no per-Electron-version native rebuild is needed.
npmRebuild: false
asar: true
# Tesseract runs in worker threads, which cannot load scripts from inside
# app.asar, and better-sqlite3 is a native module. Keeping every dependency
# unpacked lets them resolve each other normally; app.asar then holds just
# the bundled app code.
asarUnpack:
  - node_modules/**
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  files:
    - '!node_modules/better-sqlite3/prebuilds/{darwin,linux,linuxmusl}-*'
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}
  deleteAppDataOnUninstall: false
portable:
  artifactName: ${productName}-Portable-${version}.${ext}
mac:
  target: dmg
  files:
    - '!node_modules/better-sqlite3/prebuilds/{win32,linux,linuxmusl}-*'
linux:
  target: AppImage
  files:
    - '!node_modules/better-sqlite3/prebuilds/{win32,darwin}-*'
