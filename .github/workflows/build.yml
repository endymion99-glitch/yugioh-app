name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub Release (version taken from package.json)
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Fingerprints every card artwork on YGOprodeck so the app can recognise
  # cards by their picture. Each run starts from the most recently saved
  # index and only downloads cards it doesn't have yet, so after the first
  # (~20 minute) run this takes a minute or two.
  art-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache/restore@v4
        with:
          path: resources/art-index.bin
          key: art-index-v1-${{ github.run_id }}
          restore-keys: art-index-v1-
      - run: npm run art-index
        timeout-minutes: 60
      # Save and ship even a partial index: cards missing from it just fall
      # back to name matching, and the next run fills the gaps.
      - if: ${{ always() && hashFiles('resources/art-index.bin') != '' }}
        uses: actions/cache/save@v4
        with:
          path: resources/art-index.bin
          key: art-index-v1-${{ github.run_id }}
      - if: ${{ always() && hashFiles('resources/art-index.bin') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: art-index
          path: resources/art-index.bin
          retention-days: 7

  windows:
    needs: [test, art-index]
    # If the artwork index couldn't be built (e.g. YGOprodeck unreachable),
    # still ship the app; it then matches screenshots by name only.
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: art-index
          path: resources
      - run: npm run dist:win
        env:
          # No code-signing certificate is configured.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: dist/*.exe
          if-no-files-found: error

  # Publishes the Windows builds as a GitHub Release, either when a version
  # tag is pushed (git tag v0.2.0 && git push origin v0.2.0) or when the
  # workflow is run by hand with "release" ticked (tag made from package.json).
  release:
    needs: windows
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: YGO Collection Manager ${{ steps.version.outputs.tag }}
          files: dist/*.exe
          make_latest: true
          body: |
            ## Download

            Pick **one**:

            - The **Setup** file installs the app with a Start menu entry and desktop shortcut. Recommended for everyday use.
            - The **Portable** file runs without installing. It opens a little slower because it unpacks itself each time.

            Needs 64-bit Windows 10 or 11 and an internet connection for importing cards.

            **"Windows protected your PC"?** Click **More info**, then **Run anyway**. The app isn't registered with Microsoft, so Windows shows this for any new download like it.

            Your collection and decks are stored on your PC (`%APPDATA%\YGO Collection Manager`), not in the .exe, so updating to a new version keeps them.
